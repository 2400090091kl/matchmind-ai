services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: matchmind-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: matchmind-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
